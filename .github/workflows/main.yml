name: Atualizador de IPTV Automático

on:
  workflow_dispatch: # Cria um botão para você rodar manualmente quando quiser

concurrency:
  group: atualizacao-iptv
  cancel-in-progress: true
  
permissions:
  contents: write # Dá permissão para o bot salvar a lista nova

jobs:
  gerar-lista:
    runs-on: ubuntu-22.04

    steps:
    - name: Clonar o repositório
      uses: actions/checkout@v3

    - name: Preparar o ambiente Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests cloudscraper

    - name: Extrair links e gerar M3U
      run: python iptv.py

    - name: Fazer o commit da nova lista
      run: |
        git config --global user.name "Robô IPTV"
        git config --global user.email "robo@tv.local"
        git add tv.m3u
        git commit -m "Atualizando links M3U8 [Automático]" || echo "Nenhuma mudança necessária"
        git pull --rebase origin main
        git push
