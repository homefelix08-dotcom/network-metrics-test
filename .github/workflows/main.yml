name: Updater

on:
  workflow_dispatch:

concurrency:
  group: updates
  cancel-in-progress: true
  
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install cloudscraper requests urllib3

    - name: Rodar o sync
      run: sync_worker.py

    - name: Fazer o commit da nova lista
      run: |
        git config --global user.name "Data Sync Bot"
        git config --global user.email "bot@pipeline.local"
        git add export_data.txt
        git commit -m "chore: auto-sync data nodes" || echo "Nenhuma mudança necessária"
        git pull --rebase origin main
        git push
