name: Updater

on:
  workflow_dispatch:

concurrency:
  group: updates
  cancel-in-progress: true
  
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install cloudscraper requests urllib3 beautifulsoup4 pytz  

    - name: Rodar o sync
      run: python scripts/sync_worker.py

    - name: Rodar o gerador
      run: python scripts/generate_list.py

    - name: Commit and Push
      run: |
        git config --global user.name "Data Sync Bot"
        git config --global user.email "bot@github.com"
        
        # 1. Adiciona as mudanças e faz o commit
        git add .
        git commit -m "chore: auto-sync data nodes" || echo "No changes to commit"
        
        # 2. Sincroniza com o remoto usando rebase e guardando mudanças locais temporárias
        # O parâmetro --autostash resolve o erro de 'unstaged changes'
        git pull --rebase --autostash
        
        # 3. Faz o push final
        git push
